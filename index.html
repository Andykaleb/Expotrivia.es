<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExpoCredit | Trivia Broker University</title>
<style>
  :root{
    --bg1:#03142e; --bg2:#06306b; --cyan:#12a8ff; --cyan2:#00d0ff;
    --card:rgba(8,30,66,.78); --line:rgba(18,168,255,.45);
    --ok:#2ee59d; --bad:#ff5d73; --txt:#f2f7ff; --muted:#9db7d9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; font-family:"Poppins","Segoe UI",Roboto,Arial,sans-serif;
    color:var(--txt);
    background:radial-gradient(1200px 600px at 20% -10%,#0a3d85 0%,transparent 60%),
               radial-gradient(900px 500px at 100% 100%,#07509e 0%,transparent 55%),
               linear-gradient(160deg,var(--bg1),#020b1c);
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  .wrap{width:100%; max-width:720px}
  .logo{display:block; width:220px; max-width:60%; margin:0 auto 18px}
  .card{
    background:var(--card); border:1.5px solid var(--line); border-radius:22px;
    padding:30px 28px; backdrop-filter:blur(6px);
    box-shadow:0 20px 60px rgba(0,0,0,.45), 0 0 40px rgba(18,168,255,.12);
  }
  h1{font-size:clamp(1.6rem,5vw,2.2rem); text-align:center; line-height:1.15}
  h1 span{color:var(--cyan)}
  .sub{color:var(--muted); text-align:center; margin:12px 0 24px; font-size:.98rem}
  .rules{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:26px}
  .chip{border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:.85rem; color:var(--cyan2)}
  button{font-family:inherit; cursor:pointer}
  .btn{
    display:block; margin:0 auto; border:0; border-radius:14px; padding:14px 34px;
    font-size:1.05rem; font-weight:700; color:#03142e;
    background:linear-gradient(90deg,var(--cyan2),var(--cyan));
    box-shadow:0 8px 24px rgba(18,168,255,.35); transition:transform .15s, box-shadow .15s;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 12px 30px rgba(18,168,255,.5)}
  .btn:disabled{opacity:.4; cursor:not-allowed; transform:none}
  .hidden{display:none}

  .top{display:flex; justify-content:space-between; align-items:center; font-size:.9rem; color:var(--muted); margin-bottom:10px}
  .score-pill{color:var(--cyan2); font-weight:700}
  .bar{height:10px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; margin-bottom:24px}
  .bar > i{display:block; height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,var(--cyan2),var(--cyan)); transition:width .5s ease}
  .q{font-size:clamp(1.15rem,3.6vw,1.45rem); font-weight:600; line-height:1.35; margin-bottom:20px}
  .adv{display:block; width:fit-content; margin-bottom:10px; padding:4px 12px; border-radius:999px; font-size:.78rem; font-weight:700;
    color:#03142e; background:linear-gradient(90deg,#ffd84d,#ffb02e)}
  .q{display:block}
  .opts{display:grid; gap:12px}
  .opt{
    text-align:left; padding:14px 16px; border-radius:14px; font-size:1rem; color:var(--txt);
    background:rgba(255,255,255,.04); border:1.5px solid var(--line); transition:all .15s;
    display:flex; gap:12px; align-items:flex-start;
  }
  .opt b{color:var(--cyan); min-width:22px}
  .opt:hover:not(:disabled){background:rgba(18,168,255,.15); transform:translateX(3px)}
  .opt:disabled{cursor:default}
  .opt.ok{border-color:var(--ok); background:rgba(46,229,157,.15)}
  .opt.bad{border-color:var(--bad); background:rgba(255,93,115,.15)}
  .fb{margin-top:18px; padding:14px 16px; border-radius:14px; font-size:.95rem; line-height:1.5;
    border-left:4px solid var(--cyan); background:rgba(18,168,255,.1)}
  .fb strong.ok{color:var(--ok)} .fb strong.bad{color:var(--bad)}
  .next{margin-top:20px}

  .ring{--p:0; width:190px; height:190px; border-radius:50%; margin:6px auto 18px;
    background:conic-gradient(var(--cyan2) calc(var(--p)*1%), rgba(255,255,255,.1) 0);
    display:grid; place-items:center; transition:--p 1s}
  .ring div{width:150px; height:150px; border-radius:50%; background:#06214a; display:grid; place-items:center;
    font-size:2.8rem; font-weight:800; color:var(--cyan2)}
  .res-title{font-size:1.5rem; text-align:center; font-weight:700}
  .res-msg{color:var(--muted); text-align:center; margin:10px 0 22px; line-height:1.5}
  .res-detail{text-align:center; color:var(--txt); margin-bottom:22px; font-size:.95rem}
  footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:18px}
  @media(max-width:480px){.card{padding:22px 16px}}
</style>
</head>

    w: 6,
    e: "ExpoCredit lleva más de 26 años siendo un socio financiero estratégico para empresas en todo el mundo."
  },
  {
    q: "¿Cuál es la sede principal de ExpoCredit?",
    o: ["Ciudad de México", "Bogotá", "Miami, Estados Unidos", "Lima"],
    a: 2,
    w: 6,
    e: "La sede principal está en Miami (Brickell Ave.). Además hay oficinas comerciales en México, Colombia y Perú."

    a: 1,
    w: 6,

  {

    o: ["En 24 horas", "En 7 días", "En 15 días", "En 30 días"],
    a: 0,
    w: 6,
    e: "El desembolso se realiza en un máximo de 24 horas."
  },
  {
    q: "¿Entre qué porcentajes suelen oscilar las comisiones de los brókers sobre los ingresos generados por cada operación referida?",
    o: ["Entre 1% y 2%", "Entre 5% y 10%", "Entre 25% y 30%", "Entre 50% y 60%"],
    a: 1,
    w: 6,
    e: "Las comisiones de brókers generalmente oscilan entre el 5% y el 10% de los ingresos generados por cada operación referida."
  },

    q: "Una factura de $1,000,000 con comisión de factoraje de 1.5% mensual a 60 días (2 meses) y un bróker con el 10% de comisión. ¿Cuánto gana el bróker?",
    o: ["$1,500", "$3,000", "$15,000", "$30,000"],
    a: 1,
    w: 6,
    e: "Ingreso generado: $1,000,000 × 1.5% × 2 = $30,000. Comisión del bróker: $30,000 × 10% = $3,000."
  },
  {
    q: "¿Cuándo recibe el bróker el pago de su comisión?",
    o: ["El mismo día que refiere al cliente", "Dentro de los primeros 15 días del mes siguiente", "Cada 6 meses", "Solo al final del año"],

    a: 1,
    w: 6,
    e: "My Expo centraliza todo el proceso del bróker: registro, documentación, capacitación y seguimiento en un solo lugar."
  },

const TOTAL = QUESTIONS.reduce((s,q)=>s+q.w,0); // debe sumar 100
const $ = id => document.getElementById(id);
let idx = 0, correct = 0, score = 0, done = 0, locked = false;

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function show(id){ ["start","quiz","result"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); }

function start(){ idx=0; correct=0; score=0; done=0; show("quiz"); render(); }

function render(){
  locked=false;
  const item = QUESTIONS[idx];
  $("counter").textContent = `Pregunta ${idx+1} de ${QUESTIONS.length}`;
  $("live").textContent = `Acumulado: ${score}%`;
  $("bar").style.width = done + "%";
  $("question").innerHTML = (item.adv ? '<span class="adv">⭐ Pregunta avanzada · vale '+item.w+'%</span>' : '') + "";
  $("question").appendChild(document.createTextNode(item.q));
  $("fb").classList.add("hidden");
  $("btnNext").classList.add("hidden");
  $("btnNext").textContent = idx === QUESTIONS.length-1 ? "Ver mi resultado" : "Siguiente";
  const box = $("options"); box.innerHTML = "";
  const order = shuffle(item.o.map((t,i)=>({t,i})));
  order.forEach((opt,n)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<b>${"ABCD"[n]}.</b><span></span>`;
    b.querySelector("span").textContent = opt.t;
    b.onclick = () => answer(b, opt.i === item.a, box);
    b.dataset.right = opt.i === item.a ? "1" : "0";
    box.appendChild(b);
  });
}

function answer(btn, isRight, box){
  if(locked) return; locked = true;
  [...box.children].forEach(b=>{ b.disabled = true; if(b.dataset.right==="1") b.classList.add("ok"); });
  const item = QUESTIONS[idx];
  done += item.w;
  if(isRight){ correct++; score += item.w; } else { btn.classList.add("bad"); }
  const fb = $("fb");
  fb.innerHTML = isRight
    ? `<strong class="ok">¡Correcto! +${item.w}%</strong><br>${item.e}`
    : `<strong class="bad">Incorrecto (+0%)</strong><br>${item.e}`;
  fb.classList.remove("hidden");
  $("live").textContent = `Acumulado: ${score}%`;
  $("bar").style.width = done + "%";
  $("btnNext").classList.remove("hidden");
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length) finish(); else render();
}

function finish(){
  show("result");
  const pct = score;
  $("pct").textContent = pct + "%";
  $("ring").style.setProperty("--p", pct);
  let t, m;
  if(pct === 100){ t="¡Bróker Élite! 🏆"; m="Dominas el programa de ExpoCredit al 100%. Estás listo para empezar a referir y generar comisiones."; }
  else if(pct >= 70){ t="¡Muy buen trabajo! 🚀"; m="Tienes una base sólida. Repasa los detalles que fallaste y estarás listo para referir con confianza."; }
  else if(pct >= 40){ t="Vas por buen camino 📈"; m="Aún hay conceptos por reforzar. Revisa la presentación de Broker University y vuelve a intentarlo."; }
  else { t="¡Es hora de repasar! 📚"; m="No te preocupes: revisa la presentación con calma, asiste a Broker University y prueba de nuevo."; }
  $("resTitle").textContent = t;
  $("resMsg").textContent = m;
  $("resDetail").textContent = `Respondiste correctamente ${correct} de ${QUESTIONS.length} preguntas y sumaste ${score}% de ${TOTAL}%.`;
}

$("btnStart").onclick = start;
$("btnNext").onclick = next;
$("btnRestart").onclick = start;
</script>
</body>
</html>
